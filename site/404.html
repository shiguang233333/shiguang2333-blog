    .nav-right { display: flex; align-items: center; gap: 16px; }

    .wrap {
      flex: 1;
      padding: 48px var(--px) 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* From Uiverse.io by preet_7613 */
    .my-custom-face-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 380px;
      background: transparent;
      color: #ffffff;
    }

    .my-custom-face-container .face {
      width: 200px;
    }

    .my-custom-face-container .face__eyes,
    .my-custom-face-container .face__eye-lid,
    .my-custom-face-container .face__mouth-left,
    .my-custom-face-container .face__mouth-right,
    .my-custom-face-container .face__nose,
    .my-custom-face-container .face__pupil {
      animation: eyes 1s 0.3s forwards;
    }

    .my-custom-face-container .face__eye-lid,
    .my-custom-face-container .face__pupil {
      animation-duration: 4s;
      animation-delay: 1.3s;
      animation-iteration-count: infinite;
    }

    .my-custom-face-container .face__eye-lid { animation-name: eye-lid; }
    .my-custom-face-container .face__mouth-left { animation-name: mouth-left; }
    .my-custom-face-container .face__mouth-right { animation-name: mouth-right; }
    .my-custom-face-container .face__nose { animation-name: nose; }
    .my-custom-face-container .face__pupil { animation-name: pupil; }

    @keyframes eye-lid {
      0%, 40%, 45%, 100% { transform: translateY(0); }
      42.5% { transform: translateY(17.5px); }
    }

    @keyframes eyes {
      from { transform: translateY(112.5px); }
      to { transform: translateY(15px); }
    }

    @keyframes pupil {
      0%, 37.5%, 40%, 45%, 87.5%, 100% {
        stroke-dashoffset: 0;
        transform: translate(0, 0);
      }
      12.5%, 25%, 62.5%, 75% {
        transform: translate(-35px, 0);
      }
      42.5% {
        stroke-dashoffset: 35;
        transform: translate(0, 17.5px);
      }
    }

    @keyframes mouth-left {
      from, 50% { stroke-dashoffset: -102; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes mouth-right {
      from, 50% { stroke-dashoffset: 102; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes nose {
      from { transform: translate(0, 0); }
      to { transform: translate(0, 22.5px); }
    }
    /* End Uiverse */

    .code {
      font-size: 88px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 4px;
      margin-top: -12px;
      background: linear-gradient(135deg, #7b4397, #dc2430);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .msg {
      margin-top: 16px;
      font-size: 18px;
      color: var(--fg);
    }
    .sub {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);

    .btn-home {

    .btn-home:hover {
      background: linear-gradient(135deg, #7b4397, #dc2430);
      border-color: transparent;
      transform: translateY(-1px);
    }

    .input-container { position:relative; width:100%; max-width:270px; }
    .input-container .input { width:100%; max-width:270px; height:60px; padding:12px; font-size:18px; font-family:"Courier New",Courier,monospace; color:#fff; background-color:#010101; border:4px solid #242424; border-radius:0; outline:none; transition:all 0.3s ease; box-shadow:8px 8px 0 #242424; box-sizing:border-box; }

    .message-card { display:flex; flex-direction:column; align-items:flex-start; gap:18px; width:100%; max-width:310px; padding:20px; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,0.35); }
    .send-btn { --primary:#ff5569; --neutral-1:#2e2e2e; --neutral-2:#1a1a1a; --radius:14px; cursor:pointer; border-radius:var(--radius); text-shadow:0 1px 1px rgba(0,0,0,0.3); border:none; box-shadow:0 0.5px 0.5px 1px rgba(0,0,0,0.2),0 10px 20px rgba(0,0,0,0.2),0 4px 5px 0 rgba(0,0,0,0.05); display:flex; align-items:center; justify-content:center; position:relative; transition:all 0.3s ease; min-width:150px; padding:14px; height:52px; font-family:"Galano Grotesque",Poppins,Montserrat,sans-serif; font-style:normal; font-size:15px; font-weight:600; color:#fff; background:var(--neutral-1); overflow:visible; }
    .send-btn:hover { transform:scale(1.02); box-shadow:0 0 1px 2px rgba(255,255,255,0.3),0 15px 30px rgba(0,0,0,0.3),0 10px 3px -3px rgba(0,0,0,0.04); }
    .send-btn:active { transform:scale(1); box-shadow:0 0 1px 2px rgba(255,255,255,0.3),0 10px 3px -3px rgba(0,0,0,0.2); }
    .send-btn:after { content:""; position:absolute; inset:0; border-radius:var(--radius); border:2.5px solid transparent; background:linear-gradient(var(--neutral-1),var(--neutral-2)) padding-box,linear-gradient(to bottom,rgba(0,0,0,0.1),rgba(0,0,0,0.45)) border-box; z-index:0; transition:all 0.4s ease; }
    .send-btn:hover::after { transform:scale(1.05,1.1); box-shadow:inset 0 -1px 3px 0 rgba(50,50,50,1); }
    .send-btn::before { content:""; inset:7px 6px 6px 6px; position:absolute; background:linear-gradient(to top,var(--neutral-1),var(--neutral-2)); border-radius:30px; filter:blur(0.5px); z-index:2; }
    .send-btn .state { padding-left:29px; z-index:2; display:flex; position:relative; }
    .send-btn .state--default span:nth-child(4) { margin-right:5px; }
    .send-btn .state--sent { display:none; }
    .send-btn .state--sent svg { transform:scale(1.25); margin-right:8px; }
    .send-btn .state p { display:flex; align-items:center; justify-content:center; }
    .send-btn .state .icon { position:absolute; left:0; top:0; bottom:0; margin:auto; transform:scale(1.25); transition:all 0.3s ease; display:flex; align-items:center; justify-content:center; }
    .send-btn .state .icon svg { overflow:visible; }
    .send-btn .outline { position:absolute; border-radius:inherit; overflow:hidden; z-index:1; opacity:0; transition:opacity 0.4s ease; inset:-2px -3.5px; }
    .send-btn .outline::before { content:""; position:absolute; inset:-100%; background:conic-gradient(from 180deg,transparent 60%,rgb(22,22,22) 80%,transparent 100%); animation:send-spin 2s linear infinite; animation-play-state:paused; }
    @keyframes send-spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    .send-btn:hover .outline { opacity:1; }
    .send-btn:hover .outline::before { animation-play-state:running; }
    .send-btn .state p span { display:block; opacity:0; animation:send-slideDown 0.8s ease forwards calc(var(--i)*0.03s); }
    .send-btn:hover p span { opacity:1; animation:send-wave 0.5s ease forwards calc(var(--i)*0.02s); }
    .send-btn:focus p span { opacity:1; animation:send-disapear 0.6s ease forwards calc(var(--i)*0.03s); }
    @keyframes send-wave { 30%{opacity:1;transform:translateY(4px)} 50%{opacity:1;transform:translateY(-3px);color:var(--primary)} 100%{opacity:1;transform:translateY(0)} }

  <script>
    // 当 404 页面在嵌套路径下加载（如 /post/xxx 或任意多级路径）时，
    // 页面内的相对导航链接（首页/标签/友链/关于/回到首页）需要补一层 ../ 才能回到站点根目录，
    // 否则会在当前目录下继续 404。仅在 /post/<slug>/… 这类已知嵌套场景下修正，
    // 不影响 GitHub Pages 等根路径或单级路径部署。
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      var segs = location.pathname.split('/').filter(Boolean);
      if (!(segs.length > 1 && segs[0] === 'post')) return;
      var href = a.getAttribute('href') || '';
      if (/^(index|post|tags|links|about)\.html/i.test(href) && href.indexOf('../') !== 0) {
        a.setAttribute('href', '../' + href);
      }
    });

    // ---- 留言（静态版） ----
    var messageForm = document.getElementById('message-form');
    var messageMsg = document.getElementById('message-msg');
    if (messageForm && messageMsg) {
      messageForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var content = document.getElementById('message-content').value.trim();
        if (!content) {
          messageMsg.textContent = '留言内容不能为空';
          messageMsg.hidden = false;
          return;
        }
        messageForm.reset();
        messageMsg.textContent = '感谢留言，但留言板还未上线';
        messageMsg.hidden = false;
      });
    }
  </script>
</body></html>
