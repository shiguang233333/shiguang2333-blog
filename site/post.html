<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>文章 · 时光</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #141414;
      --surface-2: #1d1d1d;
      --surface-3: #242424;
      --surface-4: #303030;
      --fg: #ffffff;
      --muted: #999999;
      --border: rgba(255,255,255,0.1);
      --accent: #ffffff;
      --accent-hover: #e6e6e6;
      --font-display: "Geist", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: "Geist", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "EB Garamond", Georgia, serif;
      --font-mono: "JetBrains Mono", "SF Mono", monospace;
      --max-w: 720px;
      --px: 40px;
      --nav-h: 64px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--px);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 32px; }
    .nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
    .nav-logo svg { width: 20px; height: 20px; }
    .nav-links { display: flex; gap: 24px; font-size: 14px; color: var(--muted); }
    .nav-links a:hover { color: var(--fg); }
    .nav-right { display: flex; align-items: center; gap: 16px; }

    .btn-primary {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      background: var(--fg);
      color: var(--bg);
      transition: opacity .2s;
    }
    .btn-primary:hover { opacity: .85; }

    .wrap {
      width: calc(100% - 2 * var(--px));
      margin: 0 auto;
      padding: 48px 0 80px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 40px;
      align-items: start;
    }

    .post-head { margin-bottom: 40px; }

    .post-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-4);
      color: var(--muted);
      margin-bottom: 16px;
    }

    .post-title {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .post-meta {
      font-size: 14px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .post-tag-link {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-4);
      color: var(--muted);
      border: 1px solid var(--border);
      transition: color .2s, border-color .2s;
    }
    .post-tag-link:hover { color: var(--fg); border-color: rgba(255,255,255,.3); }
    .post-summary {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
      padding: 16px 0;
    }

    .post-cover {
      width: 72%;
      border-radius: 16px;
      margin-bottom: 0;
      display: block;
      height: auto;
    }

    /* SECTION DIVIDERS & DOWNLOADS */
    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 40px 0;
    }
    .post-downloads {
      margin-top: 0;
    }

    /* DOWNLOAD BUTTONS（From Uiverse.io by vinodjangid07） */
    .dl-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .dl-button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: fit-content;
      height: 45px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 0px 15px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: transparent;
      box-shadow: inset 2px 1px 6px rgba(255,255,255,0.06);
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s;
      color: #fff;
    }
    .dl-button .folderContainer {
      width: 40px;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
    }
    .dl-button .fileBack {
      z-index: 1;
      width: 80%;
      height: auto;
    }
    .dl-button .filePage {
      width: 50%;
      height: auto;
      position: absolute;
      z-index: 2;
      transition: all 0.3s ease-out;
    }
    .dl-button .fileFront {
      width: 85%;
      height: auto;
      position: absolute;
      z-index: 3;
      opacity: 0.95;
      transform-origin: bottom;
      transition: all 0.3s ease-out;
    }
    .dl-button .text {
      color: inherit;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .dl-button:hover .filePage {
      transform: translateY(-5px);
    }
    .dl-button:active {
      transform: scale(0.95);
    }
    .dl-button:hover .fileFront {
      transform: rotateX(30deg);
    }
    .dl-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .dl-note {
      margin: 0;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.3px;
      padding-left: 2px;
    }

    /* MARKDOWN BODY */
    .post-body { font-size: 17px; }

    .post-body h1, .post-body h2, .post-body h3, .post-body h4 {
      font-family: var(--font-display);
      margin: 1.6em 0 0.6em;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .post-body h1 { font-size: 28px; }
    .post-body h2 { font-size: 24px; }
    .post-body h3 { font-size: 20px; }
    .post-body p { margin: 1.1em 0; }
    .post-body a { color: var(--accent); border-bottom: 1px solid rgba(255,255,255,0.3); }
    .post-body a:hover { border-bottom-color: var(--accent); }
    .post-body strong { font-weight: 600; }
    .post-body ul, .post-body ol { margin: 1.1em 0; padding-left: 1.5em; }
    .post-body li { margin: 0.4em 0; }
    .post-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 20px;
      margin: 1.4em 0;
      color: var(--muted);
      font-style: italic;
    }
    .post-body code {
      font-family: var(--font-mono);
      background: var(--surface-3);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.88em;
    }
    .post-body pre {
      position: relative;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 16px 16px;
      overflow-x: auto;
      margin: 1.4em 0;
    }
    .post-body pre code { background: none; padding: 0; }
    .copy-code {
      position: absolute; top: 8px; right: 8px;
      padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface-3); color: var(--muted); font-size: 11px; cursor: pointer;
    }
    .copy-code:hover { color: var(--fg); border-color: rgba(255,255,255,.3); }
    .post-body img { border-radius: 12px; margin: 1.4em 0; }
    .post-body .image-card {
      display: block; width: fit-content; max-width: 100%; margin: 1.8em auto;
      padding: 14px; border-radius: 30px; background: #212121;
      box-shadow: 15px 15px 30px rgb(25,25,25), -15px -15px 30px rgb(60,60,60);
    }
    .post-body .image-card img { display: block; width: auto; max-width: 100%; height: auto; margin: 0; border-radius: 20px; }
    .post-body .video-card { display: block; width: 100%; max-width: 100%; margin: 1.8em auto; padding: 14px; border-radius: 30px; background: #212121; box-shadow: 15px 15px 30px rgb(25,25,25), -15px -15px 30px rgb(60,60,60); }
    .post-body .video-card video { display: block; width: 100%; max-width: 100%; height: auto; margin: 0; border-radius: 20px; }
    .post-body hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    .post-body table { width: 100%; border-collapse: collapse; margin: 1.4em 0; }
    .post-body th, .post-body td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 15px; }
    .post-body th { background: var(--surface-2); }

    .not-found {
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
    }
    .not-found h1 { font-family: var(--font-display); font-size: 32px; color: var(--fg); margin-bottom: 12px; }
    .not-found a { color: var(--accent); }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
      transition: color .2s;
    }
    .back-home:hover { color: var(--fg); }

    /* 右侧相关文章分栏 */
    .related {
      position: sticky;
      top: calc(var(--nav-h) + 24px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }
    .related-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 14px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .related-item { display: block; padding: 14px 4px; border-top: 1px solid var(--border); }
    .related-item:first-of-type { border-top: none; }
    .related-name { font-size: 16px; font-weight: 600; color: var(--fg); line-height: 1.45; transition: color .2s; }
    .related-item:hover .related-name { color: var(--accent); }
    .related-preview {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .related-empty { font-size: 14px; color: var(--muted); }

    /* LOADER（From Uiverse.io by satyamchaudharydev） */
    .loader-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 0;
    }
    .loader-wrap--tight { padding: 24px 0; }
    .spinner {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      margin-left: -75px;
    }
    .spinner span {
      position: absolute;
      top: 50%;
      left: var(--left);
      width: 35px;
      height: 7px;
      background: #ffffff;
      animation: dominos 1s ease infinite;
      box-shadow: 2px 2px 3px 0px black;
    }
    .spinner span:nth-child(1) { --left: 80px; animation-delay: 0.125s; }
    .spinner span:nth-child(2) { --left: 70px; animation-delay: 0.3s; }
    .spinner span:nth-child(3) { left: 60px; animation-delay: 0.425s; }
    .spinner span:nth-child(4) { animation-delay: 0.54s; left: 50px; }
    .spinner span:nth-child(5) { animation-delay: 0.665s; left: 40px; }
    .spinner span:nth-child(6) { animation-delay: 0.79s; left: 30px; }
    .spinner span:nth-child(7) { animation-delay: 0.915s; left: 20px; }
    .spinner span:nth-child(8) { left: 10px; }
    @keyframes dominos {
      50% { opacity: 0.7; }
      75% { -webkit-transform: rotate(90deg); transform: rotate(90deg); }
      80% { opacity: 1; }
    }

    /* FOOTER */
    .footer { background:var(--bg); border-top:1px solid var(--border); padding:64px var(--px) 48px; }
    .footer-inner { padding:0 var(--px); }
    .footer-grid { display:grid; grid-template-columns:2.2fr 1fr; gap:32px; margin-bottom:48px; }
    .footer-col h4 { font-size:13px; font-weight:600; margin-bottom:16px; color:var(--fg); }
    .footer-col ul { list-style:none; }
    .footer-col li { margin-bottom:10px; }
    .footer-col a { font-size:13px; color:var(--muted); transition:color 0.2s; }
    .footer-col a:hover { color:var(--fg); }
    .footer-left { display:flex; flex-direction:row; gap:48px; }
    .footer-message-col { justify-self:end; width:100%; max-width:420px; }
    .footer-message .callback-title { margin-bottom:14px; }
    .footer-message-form { display:flex; flex-direction:column; align-items:flex-start; gap:0; }
    .input-container { position:relative; width:100%; max-width:270px; }
    .input-container .input { width:100%; max-width:270px; height:60px; padding:12px; font-size:18px; font-family:"Courier New",Courier,monospace; color:#fff; background-color:#010101; border:4px solid #242424; border-radius:0; outline:none; transition:all 0.3s ease; box-shadow:8px 8px 0 #242424; box-sizing:border-box; }
    .input-container .input::placeholder { color:#9a9a9a; }
    .input-container .input:hover { transform:translate(-4px,-4px); box-shadow:12px 12px 0 #242424; }
    .input-container .input:focus { background-color:#fff; color:#000; border-color:#000; animation:input-shake 0.5s ease-in-out; }
    .input-container .input:focus::placeholder { color:#888; }
    .input-container .input:not(:placeholder-shown) { font-weight:bold; letter-spacing:1px; text-shadow:0 0 0 #fff; }
    @keyframes input-shake { 0%{transform:translateX(0)} 25%{transform:translateX(-5px) rotate(-5deg)} 50%{transform:translateX(5px) rotate(5deg)} 75%{transform:translateX(-5px) rotate(-5deg)} 100%{transform:translateX(0)} }
    .message-card { display:flex; flex-direction:column; align-items:flex-start; gap:18px; width:100%; max-width:310px; padding:20px; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,0.35); }
    .send-btn { --primary:#ff5569; --neutral-1:#2e2e2e; --neutral-2:#1a1a1a; --radius:14px; cursor:pointer; border-radius:var(--radius); text-shadow:0 1px 1px rgba(0,0,0,0.3); border:none; box-shadow:0 0.5px 0.5px 1px rgba(0,0,0,0.2),0 10px 20px rgba(0,0,0,0.2),0 4px 5px 0 rgba(0,0,0,0.05); display:flex; align-items:center; justify-content:center; position:relative; transition:all 0.3s ease; min-width:150px; padding:14px; height:52px; font-family:"Galano Grotesque",Poppins,Montserrat,sans-serif; font-style:normal; font-size:15px; font-weight:600; color:#fff; background:var(--neutral-1); overflow:visible; }
    .send-btn:hover { transform:scale(1.02); box-shadow:0 0 1px 2px rgba(255,255,255,0.3),0 15px 30px rgba(0,0,0,0.3),0 10px 3px -3px rgba(0,0,0,0.04); }
    .send-btn:active { transform:scale(1); box-shadow:0 0 1px 2px rgba(255,255,255,0.3),0 10px 3px -3px rgba(0,0,0,0.2); }
    .send-btn:after { content:""; position:absolute; inset:0; border-radius:var(--radius); border:2.5px solid transparent; background:linear-gradient(var(--neutral-1),var(--neutral-2)) padding-box,linear-gradient(to bottom,rgba(0,0,0,0.1),rgba(0,0,0,0.45)) border-box; z-index:0; transition:all 0.4s ease; }
    .send-btn:hover::after { transform:scale(1.05,1.1); box-shadow:inset 0 -1px 3px 0 rgba(50,50,50,1); }
    .send-btn::before { content:""; inset:7px 6px 6px 6px; position:absolute; background:linear-gradient(to top,var(--neutral-1),var(--neutral-2)); border-radius:30px; filter:blur(0.5px); z-index:2; }
    .send-btn .state { padding-left:29px; z-index:2; display:flex; position:relative; }
    .send-btn .state--default span:nth-child(4) { margin-right:5px; }
    .send-btn .state--sent { display:none; }
    .send-btn .state--sent svg { transform:scale(1.25); margin-right:8px; }
    .send-btn .state p { display:flex; align-items:center; justify-content:center; }
    .send-btn .state .icon { position:absolute; left:0; top:0; bottom:0; margin:auto; transform:scale(1.25); transition:all 0.3s ease; display:flex; align-items:center; justify-content:center; }
    .send-btn .state .icon svg { overflow:visible; }
    .send-btn .outline { position:absolute; border-radius:inherit; overflow:hidden; z-index:1; opacity:0; transition:opacity 0.4s ease; inset:-2px -3.5px; }
    .send-btn .outline::before { content:""; position:absolute; inset:-100%; background:conic-gradient(from 180deg,transparent 60%,rgb(22,22,22) 80%,transparent 100%); animation:send-spin 2s linear infinite; animation-play-state:paused; }
    @keyframes send-spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    .send-btn:hover .outline { opacity:1; }
    .send-btn:hover .outline::before { animation-play-state:running; }
    .send-btn .state p span { display:block; opacity:0; animation:send-slideDown 0.8s ease forwards calc(var(--i)*0.03s); }
    .send-btn:hover p span { opacity:1; animation:send-wave 0.5s ease forwards calc(var(--i)*0.02s); }
    .send-btn:focus p span { opacity:1; animation:send-disapear 0.6s ease forwards calc(var(--i)*0.03s); }
    @keyframes send-wave { 30%{opacity:1;transform:translateY(4px)} 50%{opacity:1;transform:translateY(-3px);color:var(--primary)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes send-slideDown { 0%{opacity:0;transform:translateY(-20px) translateX(5px) rotate(-90deg);color:var(--primary);filter:blur(5px)} 30%{opacity:1;transform:translateY(4px);filter:blur(0)} 50%{opacity:1;transform:translateY(-3px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes send-disapear { from{opacity:1} to{opacity:0;transform:translateX(5px) translateY(20px);color:var(--primary);filter:blur(5px)} }
    .send-btn .state--default .icon svg { animation:send-land 0.6s ease forwards; }
    .send-btn:hover .state--default .icon { transform:rotate(45deg) scale(1.25); }
    .send-btn:focus .state--default svg { animation:send-takeOff 0.8s linear forwards; }
    .send-btn:focus .state--default .icon { transform:rotate(0) scale(1.25); }
    @keyframes send-takeOff { 0%{opacity:1} 60%{opacity:1;transform:translateX(70px) rotate(45deg) scale(2)} 100%{opacity:0;transform:translateX(160px) rotate(45deg) scale(0)} }
    @keyframes send-land { 0%{transform:translateX(-60px) translateY(30px) rotate(-50deg) scale(2);opacity:0;filter:blur(3px)} 100%{transform:translateX(0) translateY(0) rotate(0);opacity:1;filter:blur(0)} }
    .send-btn .state--default .icon:before { content:""; position:absolute; top:50%; height:2px; width:0; left:-5px; background:linear-gradient(to right,transparent,rgba(255,255,255,0.5)); }
    .send-btn:focus .state--default .icon:before { animation:send-contrail 0.8s linear forwards; }
    @keyframes send-contrail { 0%{width:0;opacity:1} 8%{width:15px} 60%{opacity:0.7;width:80px} 100%{opacity:0;width:160px} }
    .send-btn:focus .state--default { position:absolute; }
    .send-btn:focus .state--sent { display:flex; }
    .send-btn:focus .state--sent span { opacity:0; animation:send-slideDown 0.8s ease forwards calc(var(--i)*0.2s); }
    .send-btn:focus .state--sent .icon svg { opacity:0; animation:send-appear 1.2s ease forwards 0.8s; }
    @keyframes send-appear { 0%{opacity:0;transform:scale(4) rotate(-40deg);color:var(--primary);filter:blur(4px)} 30%{opacity:1;transform:scale(0.6);filter:blur(1px)} 50%{opacity:1;transform:scale(1.2);filter:blur(0)} 100%{opacity:1;transform:scale(1)} }
    .send-btn:focus { outline:none; }
    .subscribe-msg { font-size:13px; color:var(--muted); margin-top:8px; }
    .footer-bottom { display:flex; justify-content:space-between; align-items:center; padding-top:24px; border-top:1px solid var(--border); font-size:13px; color:var(--muted); }
    .footer-bottom-links { display:flex; gap:24px; }
    .footer-bottom-links a:hover { color:var(--fg); }

    @media (max-width: 640px) {
      .post-title { font-size: 30px; }
      .post-cover { border-radius: 0; margin-left: calc(var(--px) * -1); margin-right: calc(var(--px) * -1); width: calc(100% + var(--px) * 2); max-width: none; }
      .post-body { font-size: 16px; }
      .post-body img { border-radius: 8px; }
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; gap: 32px; }
      .related { position: static; }
    }

    /* —— 音乐卡片 —— */
    .music-card .card {
      width: 100%;
      max-width: 260px;
      height: 44px;
      background: #353535;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: left;
      backdrop-filter: blur(10px);
      transition: transform 0.5s ease-in-out;
      cursor: pointer;
      position: relative;
    }
    .music-card .card:hover,
    .music-card .card.playing {
      transform: scale(1.05);
    }
    .music-card .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      padding: 1px;
      background: linear-gradient(135deg, #7b4397, #dc2430);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
    }
    .music-card .card:hover::before,
    .music-card .card.playing::before {
      opacity: 1;
    }
    .music-card .img {
      width: 34px;
      height: 34px;
      margin-left: 8px;
      border-radius: 8px;
      background: url('music-icon.jpeg') center/cover no-repeat;
      flex-shrink: 0;
    }
    .music-card .textBox {
      width: calc(100% - 62px);
      margin-left: 10px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-width: 0;
      padding-right: 8px;
    }
    .music-card .textContent {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .music-card .h1 {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .music-card .p {
      font-size: 11px;
      font-weight: lighter;
      white-space: nowrap;
    }
    .btn-sloth {
      padding: 8px 18px;
      border: none;
      border-radius: 10px;
      color: #212121;
      background: #e8e8e8;
      position: relative;
      z-index: 1;
      font-weight: 600;
      font-size: 14px;
      display: inline-block;
      text-align: center;
      overflow: hidden;
      transition: color 250ms;
    }
    .btn-sloth::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0;
      border-radius: 10px;
      background-color: #212121;
      z-index: -1;
      transition: width 250ms;
    }
    .btn-sloth:hover { color: #e8e8e8; }
    .btn-sloth:hover::before { width: 100%; }

    @media (max-width: 1024px) {
      :root { --px: 24px; }
    }
    @media (max-width: 640px) {
      :root { --px: 16px; }
      .music-card .card { max-width: 44px; padding: 0; justify-content: center; }
      .music-card .img { margin-left: 0; }
      .music-card .textBox { display: none; }
    }
  </style>
</head>
<body>

  <nav class="nav">

  <main class="wrap" id="app">

  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-grid">
        <div class="footer-col footer-left">
          <div class="footer-block">
            <h4>索引</h4>

              <li><a href="about.html">关于我</a></li>

          <div class="footer-block">

            <ul>
              <li><a href="https://github.com/shiguang233333/shiguang2333-blog">GitHub</a></li>
              <li><a href="https://x.com/guangsh76481971">Twitter</a></li>

        </div>
        <div class="footer-col footer-message-col">
          <div class="footer-message" id="subscribe">
            <h4 class="callback-title">给我留言</h4>
            <form class="footer-message-form" id="message-form">
              <div class="message-card">
                <div class="input-container">
                  <input class="input" id="message-content" name="text" type="text" placeholder="写下你的留言…" required aria-label="留言内容">
                </div>
                <button type="submit" class="send-btn" id="send-btn">
                  <div class="outline"></div>
                  <div class="state state--default">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></div>
                    <p><span style="--i:0">发</span><span style="--i:1">送</span><span style="--i:2">留</span><span style="--i:3">言</span></p>
                  </div>
                  <div class="state state--sent">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                    <p><span style="--i:5">已</span><span style="--i:6">发</span><span style="--i:7">送</span></p>

  </footer>

  <script>
    var slug = new URLSearchParams(location.search).get('slug');

    fetch('data/posts.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var posts = data.posts || [];
        var post = posts.find(function (p) { return p.slug === slug; });
        if (!post) throw new Error('notfound');
        var bodyMd = stripBodyDownloadLines(post.body || '', downloadEntries(post.downloads));
        var layoutMap = extractLayoutMap(bodyMd);
        var videoLayoutMap = extractVideoLayoutMap(bodyMd);
        bodyMd = bodyMd.replace(/\{width=\d+;align=(?:left|center|right)\}/g, '');
        var html = sanitizeHtml(marked.parse(bodyMd));
        render(post, html, layoutMap, videoLayoutMap);
        loadRelated(post, posts);
      })
      .catch(function (e) {
        var rel = document.getElementById('related');
        if (rel) rel.style.display = 'none';
        document.getElementById('content').innerHTML =
          '<div class="not-found"><h1>文章不存在</h1><p><a href="index.html">返回首页</a></p></div>';
      });

    function render(post, html, layoutMap, videoLayoutMap) {
      document.title = post.title + ' · 时光';
      var cover = '';
      if (post.image) cover = '<img class="post-cover" src="' + esc(assetPath(post.image)) + '" alt="">';
      var downloads = '';
      var downloadHtml = renderDownloads(post.downloads);
      if (downloadHtml) {
        downloads = '<hr class="section-divider">' +
          '<div class="post-downloads">' +
            downloadHtml +
          '</div>';
      }
      var summary = post.summary ? '<div class="post-summary">' + esc(post.summary) + '</div>' : '';
      var postTags = (post.tags || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
      var tagLinks = postTags.length
        ? '<span class="post-tags">' + postTags.map(function (t) {
            return '<a class="post-tag-link" href="tags.html?tag=' + encodeURIComponent(t) + '">#' + esc(t) + '</a>';
          }).join('') + '</span>'
        : '';
      document.getElementById('content').innerHTML =
        '<header class="post-head">' +
          '<span class="post-tag">' + esc(post.category) + '</span>' +
          '<h1 class="post-title">' + esc(post.title) + '</h1>' +
          '<div class="post-meta">时光 · ' + esc(fmt(post.published_at)) + '</div>' +
          tagLinks +
        '</header>' +
        cover +
        (cover ? '<hr class="section-divider">' : '') +
        summary +
        (summary ? '<hr class="section-divider">' : '') +
        '<div class="post-body">' + html + '</div>' +
        downloads;
      decorateArticleImages(layoutMap, videoLayoutMap);
      decorateCode();
      wireDownloadCards();
    }

    function downloadLabelMap(text) {
      var map = {}, match, re = /\[([^\]]+)\]\(([^)\s]+)\)/g;
      while ((match = re.exec(String(text || '')))) { if (map[match[2]] === undefined) map[match[2]] = match[1]; }
      return map;
    }
    function downloadEntries(md) {
      var labels = downloadLabelMap(md);
      var entries = [], last = null, seen = {}, lines = String(md || '').split(/\r?\n/);
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        var codeMatch = line.match(/提取码\s*[:：]\s*([^\s]+)/);
        var urlMatch = line.match(/(https?:\/\/[^\s,。，；;]+)/);
        if (urlMatch) {
          var url = urlMatch[1].replace(/[。.,，;；+\])]+$/, '');
          if (!seen[url]) { seen[url] = true; last = { url: url, code: '' }; entries.push(last); }
          if (codeMatch) last.code = codeMatch[1];
        } else if (codeMatch && last) {
          last.code = codeMatch[1];
        }
      }
      return entries.map(function (e) {
        e.label = labels[e.url] || '';
        return e;
      });
    }
    function stripBodyDownloadLines(text, entries) {
      var urls = entries.map(function (e) { return e.url; });
      var lines = String(text || '').split(/\r?\n/), out = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i], urlMatch = line.match(/(https?:\/\/[^\s,。，；;]+)/);
        var hit = urlMatch && urls.indexOf(urlMatch[1].replace(/[。.,，;；+\])]+$/, '')) !== -1;
        if (hit) {
          if (i + 1 < lines.length && /提取码\s*[:：]/.test(lines[i + 1])) i++;
          continue;
        }
        out.push(line);
      }
      return out.join('\n').replace(/\n{3,}/g, '\n\n');
    }
    function domainLabel(url) {
      try {
        var host = new URL(url).hostname;
        if (host.indexOf('quark') !== -1) return '夸克网盘';
        if (host.indexOf('baidu') !== -1) return '百度网盘';
        if (host.indexOf('aliyun') !== -1) return '阿里云盘';
        if (host.indexOf('123pan') !== -1) return '123云盘';
        if (host.indexOf('lanzou') !== -1 || host.indexOf('lanpw') !== -1) return '蓝奏云';
        if (host.indexOf('weibo') !== -1) return '微博';
        if (host.indexOf('qq.com') !== -1 || host.indexOf('tencent') !== -1) return '腾讯微云';
        if (host.indexOf('onedrive') !== -1 || host.indexOf('1drv') !== -1) return 'OneDrive';
        if (host.indexOf('xunlei') !== -1) return '迅雷云盘';
        return host;
      } catch (e) { return '下载链接'; }
    }
    function renderDownloads(md) {
      var entries = downloadEntries(md);
      if (!entries.length) return '';
      return '<div class="dl-grid">' + entries.map(function (e, i) {
        var note = (e.label || domainLabel(e.url)) + (e.code ? ' · 提取码：' + e.code : '');
        return '<div class="dl-card">' +
          '<button type="button" class="dl-button" data-url="' + esc(e.url) + '">' +
            '<span class="folderContainer">' +
              '<svg class="fileBack" width="146" height="113" viewBox="0 0 146 113" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M0 4C0 1.79086 1.79086 0 4 0H50.3802C51.8285 0 53.2056 0.627965 54.1553 1.72142L64.3303 13.4371C65.2799 14.5306 66.657 15.1585 68.1053 15.1585H141.509C143.718 15.1585 145.509 16.9494 145.509 19.1585V109C145.509 111.209 143.718 113 141.509 113H3.99999C1.79085 113 0 111.209 0 109V4Z" fill="url(#dlback' + i + ')"></path>' +
                '<defs><linearGradient id="dlback' + i + '" x1="0" y1="0" x2="72.93" y2="95.4804" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD34D"></stop><stop offset="1" stop-color="#E0A519"></stop></linearGradient></defs>' +
              '</svg>' +
              '<svg class="filePage" width="88" height="99" viewBox="0 0 88 99" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                '<rect width="88" height="99" fill="url(#dlpage' + i + ')"></rect>' +
                '<defs><linearGradient id="dlpage' + i + '" x1="0" y1="0" x2="81" y2="160.5" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#E6E6E6"></stop></linearGradient></defs>' +
              '</svg>' +
              '<svg class="fileFront" width="160" height="79" viewBox="0 0 160 79" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M0.29306 12.2478C0.133905 9.38186 2.41499 6.97059 5.28537 6.97059H30.419H58.1902C59.5751 6.97059 60.9288 6.55982 62.0802 5.79025L68.977 1.18034C70.1283 0.410771 71.482 0 72.8669 0H77H155.462C157.87 0 159.733 2.1129 159.43 4.50232L150.443 75.5023C150.19 77.5013 148.489 79 146.474 79H7.78403C5.66106 79 3.9079 77.3415 3.79019 75.2218L0.29306 12.2478Z" fill="url(#dlfront' + i + ')"></path>' +
                '<defs><linearGradient id="dlfront' + i + '" x1="38.7619" y1="8.71323" x2="66.9106" y2="82.8317" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE28A"></stop><stop offset="1" stop-color="#CA9719"></stop></linearGradient></defs>' +
              '</svg>' +
            '</span>' +
            '<p class="text">复制下载链接</p>' +
          '</button>' +
          '<p class="dl-note">' + esc(note) + '</p>' +
        '</div>';
      }).join('') + '</div>';
    }

    function wireDownloadCards() {
      document.querySelectorAll('.dl-button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var url = btn.getAttribute('data-url');
          if (!url) return;
          navigator.clipboard.writeText(url).then(function () {
            var hint = btn.querySelector('.text');
            var old = hint ? hint.textContent : '';
            if (hint) hint.textContent = '已复制';
            setTimeout(function () {
              if (hint) hint.textContent = old;
            }, 1300);
          });
        });
      });
    }

    function fmt(d) {
      if (!d) return '';
      var p = d.slice(0, 10).split('-');
      return p.length === 3 ? p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日' : d;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function assetPath(value) {
      return String(value || '').replace(/^\/(assets\/)/, '$1');
    }

    function sanitizeHtml(html) {
      var box = document.createElement('template');
      box.innerHTML = String(html || '');
      box.content.querySelectorAll('script,style,iframe,object,embed,form,input,button,svg,math').forEach(function (node) { node.remove(); });
      box.content.querySelectorAll('*').forEach(function (node) {
        Array.prototype.slice.call(node.attributes).forEach(function (attr) {
          var name = attr.name.toLowerCase();
          if (name.indexOf('on') === 0 || name === 'style' || ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(attr.value))) node.removeAttribute(attr.name);
          if ((name === 'src' || name === 'href') && attr.value.indexOf('/assets/') === 0) node.setAttribute(name, assetPath(attr.value));
        });
      });
      return box.innerHTML;
    }

    function decorateCode() {
      document.querySelectorAll('.post-body pre').forEach(function (pre) {
        if (pre.querySelector('.copy-code')) return;
        var code = pre.querySelector('code');
        if (!code) return;
        var button = document.createElement('button');
        button.className = 'copy-code'; button.type = 'button'; button.textContent = '复制代码';
        button.addEventListener('click', function () {
          navigator.clipboard.writeText(code.textContent).then(function () { button.textContent = '已复制'; setTimeout(function () { button.textContent = '复制代码'; }, 1300); });
        });
        pre.appendChild(button);
      });
    }

    function extractLayoutMap(md) {
      var map = [], re = /!\[[^\]]*\]\(([^\s)]+)\)\{width=(\d+);align=(left|center|right)\}/g, m;
      while ((m = re.exec(String(md || '')))) {
        map.push({ src: m[1], width: Number(m[2]) || 100, align: m[3] || 'center' });
      }
      return map;
    }
    function extractVideoLayoutMap(md) {
      var map = [], re = /<video[^>]*src=["']([^"']+)["'][^>]*>\{width=(\d+);align=(left|center|right)\}<\/video>/g, m;
      while ((m = re.exec(String(md || '')))) {
        map.push({ src: m[1], width: Number(m[2]) || 100, align: m[3] || 'center' });
      }
      return map;
    }
    function decorateArticleImages(layoutMap, videoLayoutMap) {
      layoutMap = layoutMap || [];
      videoLayoutMap = videoLayoutMap || [];
      document.querySelectorAll('.post-body img').forEach(function (image, index) {
        if (image.parentNode.classList.contains('image-card')) return;
        var frame = document.createElement('span');
        frame.className = 'image-card';
        image.parentNode.insertBefore(frame, image);
        frame.appendChild(image);
        var entry = layoutMap[index];
        if (entry) {
          frame.style.width = entry.width + '%';
          frame.style.display = 'block';
          frame.style.marginLeft = entry.align === 'left' ? '0' : 'auto';
          frame.style.marginRight = entry.align === 'right' ? '0' : 'auto';
        }
      });
      document.querySelectorAll('.post-body video').forEach(function (video, index) {
        if (video.parentNode.classList.contains('video-card')) return;
        var frame = document.createElement('span');
        frame.className = 'video-card';
        video.parentNode.insertBefore(frame, video);
        frame.appendChild(video);
        video.controls = true;
        var entry = videoLayoutMap[index];
        if (entry) {
          frame.style.width = entry.width + '%';
          frame.style.display = 'block';
          frame.style.marginLeft = entry.align === 'left' ? '0' : 'auto';
          frame.style.marginRight = entry.align === 'right' ? '0' : 'auto';
        }
      });
    }

    function loadRelated(post, allPosts) {
      var listEl = document.getElementById('related-list');
      var tags = (post.tags || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
      if (tags.length === 0) {
        listEl.innerHTML = '<p class="related-empty">暂无相关文章</p>';
        return;
      }
      var related = allPosts
        .filter(function (p) { return p.slug !== post.slug && p.status === 'published'; })
        .filter(function (p) {
          var postTags = (p.tags || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
          return tags.some(function (t) { return postTags.indexOf(t) !== -1; });
        })
        .slice(0, 5);
      if (related.length === 0) {
        listEl.innerHTML = '<p class="related-empty">暂无相关文章</p>';
        return;
      }
      listEl.innerHTML = related.map(function (p) {
        var preview = (p.preview || p.summary || '').trim();
        return '<a class="related-item" href="post.html?slug=' + encodeURIComponent(p.slug) + '">' +
                 '<div class="related-name">' + esc(p.title) + '</div>' +
                 (preview ? '<div class="related-preview">' + esc(preview) + '</div>' : '') +
               '</a>';
      }).join('');
    }

    // ---- 留言（静态版） ----
    var messageForm = document.getElementById('message-form');
    var messageMsg = document.getElementById('message-msg');
    if (messageForm && messageMsg) {
      messageForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var content = document.getElementById('message-content').value.trim();
        if (!content) {
          messageMsg.textContent = '留言内容不能为空';
          messageMsg.hidden = false;
          return;
        }
        messageForm.reset();
        messageMsg.textContent = '感谢留言，但留言板还未上线';
        messageMsg.hidden = false;
      });
    }
  </script>
</body></html>
