<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>标签 · 时光</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    :root {
      --bg: #000000;
      --surface: #141414;
      --surface-2: #1d1d1d;
      --surface-3: #242424;
      --surface-4: #303030;
      --fg: #ffffff;
      --muted: #999999;
      --border: rgba(255,255,255,0.1);
      --accent: #ffffff;
      --accent-hover: #e6e6e6;
      --font-display: "Geist", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: "Geist", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "EB Garamond", Georgia, serif;
      --font-mono: "JetBrains Mono", "SF Mono", monospace;
      --nav-h: 64px;
      --px: 40px;
      --max-w: 900px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--px);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 32px; }
    .nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
    .nav-logo svg { width: 20px; height: 20px; }
    .nav-links { display: flex; gap: 24px; font-size: 14px; color: var(--muted); }
    .nav-links a:hover { color: var(--fg); }
    .nav-right { display: flex; align-items: center; gap: 16px; }

    .wrap { padding: 48px var(--px) 80px; }

    h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: var(--muted); margin-bottom: 32px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-title { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

    /* 标签选择 */
    .tag-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 14px;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all .15s;
      user-select: none;
    }
    .tag-chip:hover { border-color: rgba(255,255,255,0.3); color: var(--fg); }
    .tag-chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
    .tag-chip .count { font-size: 12px; opacity: .6; }
    .no-tags { color: var(--muted); font-size: 14px; }

    /* 排序 */
    .sort-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .sort-row .lbl { color: var(--muted); font-size: 14px; }
    .sort-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all .15s;
    }
    .sort-btn:hover { color: var(--fg); border-color: rgba(255,255,255,0.3); }
    .sort-btn.active { color: var(--fg); border-color: var(--accent); }

    /* 结果列表 */
    .post-list { display: flex; flex-direction: column; gap: 12px; }
    .post-item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color .2s, transform .2s;
    }
    .post-item:hover { border-color: rgba(255,255,255,0.25); transform: translateY(-1px); }
    .post-thumb {
      width: 180px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16/10;
      background: var(--surface-4);
    }
    .post-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .post-info { flex: 1; min-width: 0; }
    .post-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .post-preview {
      font-size: 14px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .post-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
    .post-meta .chip-list span {
      display: inline-block;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface-4);
      padding: 2px 8px;
      border-radius: 100px;
      margin-right: 4px;
    }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }

    /* FOOTER */
    .footer {
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 64px var(--px) 48px;
    }
    .footer-inner { padding: 0 var(--px); }
    .footer-grid {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 32px;
      margin-bottom: 48px;
    }
    .footer-col h4 { font-size: 13px; font-weight: 600; margin-bottom: 16px; color: var(--fg); }
    .footer-col ul { list-style: none; }
    .footer-col li { margin-bottom: 10px; }
    .footer-col a { font-size: 13px; color: var(--muted); transition: color 0.2s; }
    .footer-col a:hover { color: var(--fg); }
    .footer-left { display: flex; flex-direction: row; gap: 48px; }
    .footer-message-col { justify-self: end; width: 100%; max-width: 420px; }
    .footer-message .callback-title { margin-bottom: 14px; }
    .footer-message-form { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
    .input-container { position: relative; width: 100%; max-width: 270px; }
    .input-container .input {
      width: 100%; max-width: 270px; height: 60px; padding: 12px; font-size: 18px;
      font-family: "Courier New", Courier, monospace; color: #fff; background-color: #010101;
      border: 4px solid #242424; border-radius: 0; outline: none; transition: all 0.3s ease;
      box-shadow: 8px 8px 0 #242424; box-sizing: border-box;
    }
    .input-container .input::placeholder { color: #9a9a9a; }
    .input-container .input:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0 #242424; }
    .input-container .input:focus { background-color: #fff; color: #000; border-color: #000; animation: input-shake 0.5s ease-in-out; }
    .input-container .input:focus::placeholder { color: #888; }
    .input-container .input:not(:placeholder-shown) { font-weight: bold; letter-spacing: 1px; text-shadow: 0px 0px 0 #fff; }
    @keyframes input-shake { 0%{transform:translateX(0)} 25%{transform:translateX(-5px) rotate(-5deg)} 50%{transform:translateX(5px) rotate(5deg)} 75%{transform:translateX(-5px) rotate(-5deg)} 100%{transform:translateX(0)} }
    .message-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 18px;
      width: 100%; max-width: 310px; padding: 20px; box-sizing: border-box;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .send-btn {
      --primary: #ff5569; --neutral-1: #2e2e2e; --neutral-2: #1a1a1a; --radius: 14px;
      cursor: pointer; border-radius: var(--radius); text-shadow: 0 1px 1px rgba(0,0,0,0.3);
      border: none; box-shadow: 0 0.5px 0.5px 1px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.2), 0 4px 5px 0 rgba(0,0,0,0.05);
      display: flex; align-items: center; justify-content: center; position: relative;
      transition: all 0.3s ease; min-width: 150px; padding: 14px; height: 52px;
      font-family: "Galano Grotesque", Poppins, Montserrat, sans-serif; font-style: normal;
      font-size: 15px; font-weight: 600; color: #fff; background: var(--neutral-1); overflow: visible;
    }
    .send-btn:hover { transform: scale(1.02); box-shadow: 0 0 1px 2px rgba(255,255,255,0.3), 0 15px 30px rgba(0,0,0,0.3), 0 10px 3px -3px rgba(0,0,0,0.04); }
    .send-btn:active { transform: scale(1); box-shadow: 0 0 1px 2px rgba(255,255,255,0.3), 0 10px 3px -3px rgba(0,0,0,0.2); }
    .send-btn:after { content:""; position:absolute; inset:0; border-radius:var(--radius); border:2.5px solid transparent; background:linear-gradient(var(--neutral-1),var(--neutral-2)) padding-box, linear-gradient(to bottom,rgba(0,0,0,0.1),rgba(0,0,0,0.45)) border-box; z-index:0; transition:all 0.4s ease; }
    .send-btn:hover::after { transform: scale(1.05,1.1); box-shadow: inset 0 -1px 3px 0 rgba(50,50,50,1); }
    .send-btn::before { content:""; inset:7px 6px 6px 6px; position:absolute; background:linear-gradient(to top,var(--neutral-1),var(--neutral-2)); border-radius:30px; filter:blur(0.5px); z-index:2; }
    .send-btn .state { padding-left:29px; z-index:2; display:flex; position:relative; }
    .send-btn .state--default span:nth-child(4) { margin-right:5px; }
    .send-btn .state--sent { display:none; }
    .send-btn .state--sent svg { transform:scale(1.25); margin-right:8px; }
    .send-btn .state p { display:flex; align-items:center; justify-content:center; }
    .send-btn .state .icon { position:absolute; left:0; top:0; bottom:0; margin:auto; transform:scale(1.25); transition:all 0.3s ease; display:flex; align-items:center; justify-content:center; }
    .send-btn .state .icon svg { overflow:visible; }
    .send-btn .outline { position:absolute; border-radius:inherit; overflow:hidden; z-index:1; opacity:0; transition:opacity 0.4s ease; inset:-2px -3.5px; }
    .send-btn .outline::before { content:""; position:absolute; inset:-100%; background:conic-gradient(from 180deg,transparent 60%,rgb(22,22,22) 80%,transparent 100%); animation:send-spin 2s linear infinite; animation-play-state:paused; }
    @keyframes send-spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    .send-btn:hover .outline { opacity:1; }
    .send-btn:hover .outline::before { animation-play-state:running; }
    .send-btn .state p span { display:block; opacity:0; animation:send-slideDown 0.8s ease forwards calc(var(--i)*0.03s); }
    .send-btn:hover p span { opacity:1; animation:send-wave 0.5s ease forwards calc(var(--i)*0.02s); }
    .send-btn:focus p span { opacity:1; animation:send-disapear 0.6s ease forwards calc(var(--i)*0.03s); }
    @keyframes send-wave { 30%{opacity:1;transform:translateY(4px)} 50%{opacity:1;transform:translateY(-3px);color:var(--primary)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes send-slideDown { 0%{opacity:0;transform:translateY(-20px) translateX(5px) rotate(-90deg);color:var(--primary);filter:blur(5px)} 30%{opacity:1;transform:translateY(4px);filter:blur(0)} 50%{opacity:1;transform:translateY(-3px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes send-disapear { from{opacity:1} to{opacity:0;transform:translateX(5px) translateY(20px);color:var(--primary);filter:blur(5px)} }
    .send-btn .state--default .icon svg { animation:send-land 0.6s ease forwards; }
    .send-btn:hover .state--default .icon { transform:rotate(45deg) scale(1.25); }
    .send-btn:focus .state--default svg { animation:send-takeOff 0.8s linear forwards; }
    .send-btn:focus .state--default .icon { transform:rotate(0) scale(1.25); }
    @keyframes send-takeOff { 0%{opacity:1} 60%{opacity:1;transform:translateX(70px) rotate(45deg) scale(2)} 100%{opacity:0;transform:translateX(160px) rotate(45deg) scale(0)} }
    @keyframes send-land { 0%{transform:translateX(-60px) translateY(30px) rotate(-50deg) scale(2);opacity:0;filter:blur(3px)} 100%{transform:translateX(0) translateY(0) rotate(0);opacity:1;filter:blur(0)} }
    .send-btn .state--default .icon:before { content:""; position:absolute; top:50%; height:2px; width:0; left:-5px; background:linear-gradient(to right,transparent,rgba(255,255,255,0.5)); }
    .send-btn:focus .state--default .icon:before { animation:send-contrail 0.8s linear forwards; }
    @keyframes send-contrail { 0%{width:0;opacity:1} 8%{width:15px} 60%{opacity:0.7;width:80px} 100%{opacity:0;width:160px} }
    .send-btn:focus .state--default { position:absolute; }
    .send-btn:focus .state--sent { display:flex; }
    .send-btn:focus .state--sent span { opacity:0; animation:send-slideDown 0.8s ease forwards calc(var(--i)*0.2s); }
    .send-btn:focus .state--sent .icon svg { opacity:0; animation:send-appear 1.2s ease forwards 0.8s; }
    @keyframes send-appear { 0%{opacity:0;transform:scale(4) rotate(-40deg);color:var(--primary);filter:blur(4px)} 30%{opacity:1;transform:scale(0.6);filter:blur(1px)} 50%{opacity:1;transform:scale(1.2);filter:blur(0)} 100%{opacity:1;transform:scale(1)} }
    .send-btn:focus { outline:none; }
    .subscribe-msg { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .footer-bottom { display:flex; justify-content:space-between; align-items:center; padding-top:24px; border-top:1px solid var(--border); font-size:13px; color:var(--muted); }
    .footer-bottom-links { display:flex; gap:24px; }
    .footer-bottom-links a:hover { color: var(--fg); }

    /* —— 音乐卡片 —— */
    .music-card .card {
      width: 100%;
      max-width: 260px;
      height: 44px;
      background: #353535;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: left;
      backdrop-filter: blur(10px);
      transition: transform 0.5s ease-in-out;
      cursor: pointer;
      position: relative;
    }
    .music-card .card:hover,
    .music-card .card.playing {
      transform: scale(1.05);
    }
    .music-card .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      padding: 1px;
      background: linear-gradient(135deg, #7b4397, #dc2430);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
    }
    .music-card .card:hover::before,
    .music-card .card.playing::before {
      opacity: 1;
    }
    .music-card .img {
      width: 34px;
      height: 34px;
      margin-left: 8px;
      border-radius: 8px;
      background: url('music-icon.jpeg') center/cover no-repeat;
      flex-shrink: 0;
    }
    .music-card .textBox {
      width: calc(100% - 62px);
      margin-left: 10px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-width: 0;
      padding-right: 8px;
    }
    .music-card .textContent {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .music-card .h1 {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .music-card .p {
      font-size: 11px;
      font-weight: lighter;
      white-space: nowrap;
    }
    .btn-sloth {
      padding: 8px 18px;
      border: none;
      border-radius: 10px;
      color: #212121;
      background: #e8e8e8;
      position: relative;
      z-index: 1;
      font-weight: 600;
      font-size: 14px;
      display: inline-block;
      text-align: center;
      overflow: hidden;
      transition: color 250ms;
    }
    .btn-sloth::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0;
      border-radius: 10px;
      background-color: #212121;
      z-index: -1;
      transition: width 250ms;
    }
    .btn-sloth:hover { color: #e8e8e8; }
    .btn-sloth:hover::before { width: 100%; }

    @media (max-width: 1024px) {
      :root { --px: 24px; }
    }
    @media (max-width: 640px) {
      :root { --px: 16px; }
      .music-card .card { max-width: 44px; padding: 0; justify-content: center; }
      .music-card .img { margin-left: 0; }
      .music-card .textBox { display: none; }
    }
    @media (max-width: 560px) {
      .post-item { flex-wrap: wrap; }
      .post-thumb { width: 100%; aspect-ratio: 16/9; }
      .post-preview { -webkit-line-clamp: 2; }
    }
  </style>

  <script>
    (function () {
      'use strict';

      var state = {
        allPosts: [],
        allTags: [],
        selected: [],   // 选中的标签名
        sort: 'time',    // time | name
        order: 'desc'    // asc | desc
      };

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      var DEFAULT_IMG = 'assets/images/framerusercontent.com/sxoUHMyDJmczUkVs28JyYftbQGM-2668bf6972.png';
      var CATEGORY_IMGS = {
        '思考': 'assets/images/framerusercontent.com/sxoUHMyDJmczUkVs28JyYftbQGM-2668bf6972.png',
        '技术': 'assets/images/framerusercontent.com/HjHSNMTylBMFbluiCzd2SQtOjRE-b01ca48f79.png',
        '设计': 'assets/images/framerusercontent.com/DL8hej2J0ENXehCcjm05h3CmA-73431f28c1.png',
        '教程': 'assets/images/framerusercontent.com/438CGnEJ8fW9oxKnD8cAdepnjS0-b60b594609.png',
        '灵感': 'assets/images/framerusercontent.com/MHKTV5XuTnHaK3OZJgueKvswg-cbecbbf285.png',
        '随笔': 'assets/images/framerusercontent.com/Xflqz4b166Nn6flLSNwZ3YHpnA-0538f02d8f.png'
      };

      function coverFor(post) {
        if (post.image) return post.image;
        return CATEGORY_IMGS[post.category] || DEFAULT_IMG;
      }

      function fmtDate(d) {
        if (!d) return '';
        var p = d.slice(0, 10).split('-');
        return p.length === 3 ? p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日' : d;
      }

      function extractTags() {
        var counts = {};
        state.allPosts.forEach(function (p) {
          (p.tags || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean).forEach(function (t) {
            counts[t] = (counts[t] || 0) + 1;
          });
        });
        state.allTags = Object.keys(counts)
          .sort(function (a, b) { return counts[b] - counts[a]; })
          .map(function (name) { return { name: name, count: counts[name] }; });
      }

      function renderTags() {
        var grid = document.getElementById('tag-grid');
        if (state.allTags.length === 0) {
          grid.innerHTML = '<span class="no-tags">暂无标签</span>';
          return;
        }
        grid.innerHTML = state.allTags.map(function (t) {
          var on = state.selected.indexOf(t.name) !== -1;
          return '<span class="tag-chip' + (on ? ' active' : '') + '" data-tag="' + esc(t.name) + '">' +
                   '#' + esc(t.name) + ' <span class="count">' + t.count + '</span>' +
                 '</span>';
        }).join('');
        grid.querySelectorAll('.tag-chip').forEach(function (chip) {
          chip.addEventListener('click', function () {
            var name = chip.dataset.tag;
            var idx = state.selected.indexOf(name);
            if (idx === -1) state.selected.push(name);
            else state.selected.splice(idx, 1);
            renderTags();
            renderPosts();
          });
        });
      }

      function renderSortButtons() {
        document.querySelectorAll('.sort-btn[data-sort]').forEach(function (b) {
          b.classList.toggle('active', b.dataset.sort === state.sort);
        });
        document.querySelectorAll('.sort-btn[data-order]').forEach(function (b) {
          b.classList.toggle('active', b.dataset.order === state.order);
        });
      }

      function renderPosts() {
        var posts = state.allPosts.slice();

        if (state.selected.length > 0) {
          posts = posts.filter(function (p) {
            var postTags = (p.tags || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
            return state.selected.some(function (t) { return postTags.indexOf(t) !== -1; });
          });
        }

        var dir = state.order === 'asc' ? 1 : -1;
        posts.sort(function (a, b) {
          var r;
          if (state.sort === 'name') {
            r = String(a.title).localeCompare(String(b.title), 'zh-Hans-CN');
          } else {
            var at = a.published_at || a.created_at;
            var bt = b.published_at || b.created_at;
            r = String(at).localeCompare(String(bt));
          }
          return r * dir;
        });

        document.getElementById('result-count').textContent = posts.length;
        var list = document.getElementById('post-list');
        if (posts.length === 0) {
          list.innerHTML = '<p class="empty">共 0 篇</p>';
          return;
        }
        list.innerHTML = posts.map(function (p) {
          var preview = (p.preview || p.summary || '').trim() || (p.category ? '来自「' + p.category + '」分类的分享。' : '');
          var tags = (p.tags || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
          return '<a href="post.html?slug=' + encodeURIComponent(p.slug) + '" class="post-item">' +
                   '<div class="post-thumb"><img loading="lazy" src="' + esc(coverFor(p)) + '" alt=""></div>' +
                   '<div class="post-info">' +
                     '<div class="post-title">' + esc(p.title) + '</div>' +
                     '<div class="post-preview">' + esc(preview) + '</div>' +
                     '<div class="post-meta">' +
                       '<span class="chip-list">' + tags.map(function (t) { return '<span>#' + esc(t) + '</span>'; }).join('') + '</span>' +
'<span>' + esc(fmtDate(p.published_at)) + '</span>' +
                      '</div>' +
                   '</div>' +
                 '</a>';
        }).join('');
      }

      function init() {
        renderSortButtons();
        document.querySelectorAll('.sort-btn[data-sort]').forEach(function (b) {
          b.addEventListener('click', function () {
            state.sort = b.dataset.sort;
            renderSortButtons();
            renderPosts();
          });
        });
        document.querySelectorAll('.sort-btn[data-order]').forEach(function (b) {
          b.addEventListener('click', function () {
            state.order = b.dataset.order;
            renderSortButtons();
            renderPosts();
          });
        });
        fetch('data/posts.json')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            state.allPosts = data.posts || [];
            extractTags();
            try {
              var qTag = new URLSearchParams(window.location.search).get('tag');
              if (qTag && state.allTags.some(function (t) { return t.name === qTag; })) {
                state.selected = [qTag];
              }
            } catch (e) {}
            renderTags();
            renderPosts();
          });
      }

      init();
    })();

    // ---- 留言（静态版） ----
    var messageForm = document.getElementById('message-form');
    var messageMsg = document.getElementById('message-msg');
    if (messageForm && messageMsg) {
      messageForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var content = document.getElementById('message-content').value.trim();
        if (!content) {
          messageMsg.textContent = '留言内容不能为空';
          messageMsg.hidden = false;
          return;
        }
        messageForm.reset();
        messageMsg.textContent = '感谢留言，但留言板还未上线';
        messageMsg.hidden = false;
      });
    }
  </script>
</body></html>
