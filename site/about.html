<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>关于我 · 时光</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    :root {
      --bg: #000000;
      --surface: #141414;
      --surface-2: #1d1d1d;
      --surface-3: #242424;
      --surface-4: #303030;
      --fg: #ffffff;
      --muted: #999999;
      --border: rgba(255,255,255,0.1);
      --accent: #ffffff;
      --font: "Geist", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --nav-h: 64px;
      --px: 24px;
      --max-w: 760px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--px);
      max-width: var(--max-w);
      margin: 0 auto;
      border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .nav-left svg { width: 20px; height: 20px; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-link { color: var(--muted); font-size: 14px; transition: color .2s; }
    .nav-link:hover { color: var(--fg); }

    .wrap { max-width: var(--max-w); margin: 0 auto; padding: 48px var(--px) 80px; }

    h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: var(--muted); margin-bottom: 40px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
    }
    .panel-title { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
    .panel p { margin-bottom: 14px; color: var(--fg); }
    .panel p:last-child { margin-bottom: 0; }

    .footer {
      border-top: 1px solid var(--border);
      padding: 32px var(--px);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      :root { --px: 16px; }
      .panel { padding: 20px; }
    }
  </style>
</head><body>

  </nav>

  <footer class="footer">© 2026 时光 · 用爱发电</footer>
