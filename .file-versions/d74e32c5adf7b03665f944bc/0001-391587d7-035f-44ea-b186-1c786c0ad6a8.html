<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友链 · 时光</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    :root {
      --bg: #000000;
      --surface: #141414;
      --surface-2: #1d1d1d;
      --surface-3: #242424;
      --surface-4: #303030;
      --fg: #ffffff;
      --muted: #999999;
      --border: rgba(255,255,255,0.1);
      --accent: #ffffff;
      --font: "Geist", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --nav-h: 64px;
      --px: 24px;
      --max-w: 900px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--px);
      max-width: var(--max-w);
      margin: 0 auto;
      border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .nav-left svg { width: 20px; height: 20px; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-link { color: var(--muted); font-size: 14px; transition: color .2s; }
    .nav-link:hover { color: var(--fg); }

    .wrap { max-width: var(--max-w); margin: 0 auto; padding: 48px var(--px) 80px; }

    h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: var(--muted); margin-bottom: 32px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-title { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

    /* 友链卡片网格 */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color .2s, transform .2s;
    }
    .link-card:hover {
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }

    .link-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface-4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .link-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .link-info { flex: 1; min-width: 0; }
    .link-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      transition: color .2s;
    }
    .link-card:hover .link-name { color: var(--accent); }
    .link-desc {
      font-size: 13px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty { color: var(--muted); text-align: center; padding: 40px 0; }

    .footer {
      border-top: 1px solid var(--border);
      padding: 32px var(--px);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      :root { --px: 16px; }
      .links-grid { grid-template-columns: 1fr; }
    }
  </style>
</head><body>
  <nav class="nav">
    <a href="index.html" class="nav-left">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 0h16v8H12v8H4V0zm0 16h8v8L4 16z"></path></svg>
      时光
    </a>
    <div class="nav-right">
      <a href="index.html" class="nav-link">首页</a>
    </div>
  </nav>

  <div class="wrap">
    <h1>友链</h1>
    <p class="sub">在这里认识一些有趣的朋友。</p>

    <div class="panel">
      <div class="panel-title">友链列表</div>
      <div class="links-grid">
        <!-- 纯静态友链：直接在此追加卡片，例如：
        <a href="https://example.com" class="link-card" target="_blank" rel="noopener noreferrer">
          <div class="link-avatar">A</div>
          <div class="link-info">
            <div class="link-name">示例站</div>
            <div class="link-desc">一句简短介绍。</div>
          </div>
        </a>
        -->
        <span class="empty">暂无友链</span>
      </div>
    </div>
  </div>

  <footer class="footer">© 2026 时光 · 用爱发电</footer>
</body></html>
